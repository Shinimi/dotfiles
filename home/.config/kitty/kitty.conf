# ╭──────────────────────────────────────────────────────────────╮
# │  kitty · Tokyo Night glass                    made by Claude │
# ╰──────────────────────────────────────────────────────────────╯

# ── font ─────────────────────────────────────────────────────────
font_family        JetBrainsMono Nerd Font
bold_font          JetBrainsMono Nerd Font ExtraBold
italic_font        JetBrainsMono Nerd Font Italic
bold_italic_font   JetBrainsMono Nerd Font ExtraBold Italic
font_size          12.0
modify_font        cell_height 112%
disable_ligatures  cursor
text_composition_strategy 1.2 15

# ── window ───────────────────────────────────────────────────────
background_opacity  0.80
dynamic_background_opacity yes
window_padding_width 16 22
placement_strategy  center
hide_window_decorations yes
confirm_os_window_close 0
remember_window_size no
initial_window_width  110c
initial_window_height 30c
enable_audio_bell   no
visual_bell_duration 0
window_alert_on_bell yes

# ── cursor ───────────────────────────────────────────────────────
cursor_shape          beam
cursor_beam_thickness 1.8
cursor_blink_interval 0.55
cursor_stop_blinking_after 12
cursor_trail          3
cursor_trail_decay    0.08 0.3
cursor_trail_start_threshold 3

# ── scrolling & mouse ────────────────────────────────────────────
scrollback_lines     20000
scrollbar            scrolled
scrollbar_width      0.4
scrollbar_handle_opacity 0.6
scrollbar_radius     0.3
wheel_scroll_multiplier 4.0
touch_scroll_multiplier 2.0
copy_on_select       clipboard
strip_trailing_spaces smart
mouse_hide_wait      2.0
url_style            curly
detect_urls          yes
show_hyperlink_targets yes

# ── shell integration: tells you when a long command finishes ───
shell_integration    enabled
notify_on_cmd_finish unfocused 15.0

# ── tabs: floating pills at the bottom ──────────────────────────
tab_bar_edge            bottom
tab_bar_margin_width    10.0
tab_bar_margin_height   6.0 4.0
tab_bar_style           separator
tab_separator           "  "
tab_bar_align           center
tab_bar_min_tabs        2
tab_title_template      "  {fmt.fg._565f89}{index}{fmt.fg.tab}  {title[:28]}  "
active_tab_title_template "  {fmt.fg._16161e}{index}  {title[:28]}  "
active_tab_font_style   bold
inactive_tab_font_style normal

# ── Tokyo Night ──────────────────────────────────────────────────
foreground              #c0caf5
background              #1a1b26
selection_foreground    none
selection_background    #2e3c64
url_color               #73daca
cursor                  #c0caf5
cursor_text_color       #1a1b26
active_tab_foreground   #16161e
active_tab_background   #7aa2f7
inactive_tab_foreground #a9b1d6
inactive_tab_background #24283b
tab_bar_background      none
active_border_color     #7aa2f7
inactive_border_color   #292e42
bell_border_color       #e0af68
scrollbar_handle_color  #7aa2f7
mark1_foreground #1a1b26
mark1_background #7aa2f7
mark2_foreground #1a1b26
mark2_background #bb9af7
mark3_foreground #1a1b26
mark3_background #7dcfff

color0  #15161e
color8  #414868
color1  #f7768e
color9  #ff899d
color2  #9ece6a
color10 #9fe044
color3  #e0af68
color11 #faba4a
color4  #7aa2f7
color12 #8db0ff
color5  #bb9af7
color13 #c7a9ff
color6  #7dcfff
color14 #a4daff
color7  #a9b1d6
color15 #c0caf5
color16 #ff9e64
color17 #db4b4b

# ── splits (kitty's own layouts inside one window) ──────────────
enabled_layouts splits, stack
map ctrl+shift+enter launch --location=vsplit --cwd=current
map ctrl+shift+backslash launch --location=hsplit --cwd=current
map ctrl+shift+left  neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+up    neighboring_window up
map ctrl+shift+down  neighboring_window down
map ctrl+shift+z     toggle_layout stack

# ── keys ─────────────────────────────────────────────────────────
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0
map ctrl+shift+a>m   set_background_opacity +0.05
map ctrl+shift+a>l   set_background_opacity -0.05
map ctrl+shift+f     launch --type=overlay --stdin-source=@screen_scrollback fzf --no-sort --no-mouse --exact -i --tac
