# Kitty – Tokyo Night glass. Made by Claude.
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
font_size        12.0
disable_ligatures cursor

background_opacity 0.78
dynamic_background_opacity yes
window_padding_width 12
placement_strategy center
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell no
visual_bell_duration 0
scrollback_lines 10000
copy_on_select clipboard
strip_trailing_spaces smart
mouse_hide_wait 2.0

cursor_shape beam
cursor_beam_thickness 1.6
cursor_blink_interval 0.6
cursor_trail 3
cursor_trail_decay 0.08 0.3

# tabs: slanted Tokyo pills at the bottom
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template " {index}  {title} "
active_tab_font_style bold
inactive_tab_font_style normal

# Tokyo Night
foreground #c0caf5
background #1a1b26
selection_foreground none
selection_background #283457
url_color #73daca
url_style curly
cursor #c0caf5
cursor_text_color #1a1b26
active_tab_foreground   #16161e
active_tab_background   #7aa2f7
inactive_tab_foreground #545c7e
inactive_tab_background #292e42
tab_bar_background      none
active_border_color   #7aa2f7
inactive_border_color #292e42
bell_border_color     #e0af68
mark1_foreground #1a1b26
mark1_background #7aa2f7
mark2_foreground #1a1b26
mark2_background #bb9af7
mark3_foreground #1a1b26
mark3_background #7dcfff

color0  #15161e
color8  #414868
color1  #f7768e
color9  #ff899d
color2  #9ece6a
color10 #9fe044
color3  #e0af68
color11 #faba4a
color4  #7aa2f7
color12 #8db0ff
color5  #bb9af7
color13 #c7a9ff
color6  #7dcfff
color14 #a4daff
color7  #a9b1d6
color15 #c0caf5
color16 #ff9e64
color17 #db4b4b

# keys
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0
map ctrl+shift+a>m set_background_opacity +0.05
map ctrl+shift+a>l set_background_opacity -0.05
