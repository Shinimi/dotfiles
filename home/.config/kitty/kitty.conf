# ╭──────────────────────────────────────────────────────────────╮
# │  kitty · Shinobu Kochō glass                  made by Claude │
# ╰──────────────────────────────────────────────────────────────╯

# ── font ─────────────────────────────────────────────────────────
font_family        GeistMono Nerd Font
bold_font          GeistMono Nerd Font Bold
italic_font        VictorMono Nerd Font SemiBold Italic
bold_italic_font   VictorMono Nerd Font Bold Italic
font_size          12.5
modify_font        cell_height 106%
disable_ligatures  cursor
text_composition_strategy 1.2 15

# ── window ───────────────────────────────────────────────────────
background_opacity  0.80
dynamic_background_opacity yes
window_padding_width 16 22
placement_strategy  center
hide_window_decorations yes
confirm_os_window_close 0
remember_window_size no
initial_window_width  110c
initial_window_height 30c
enable_audio_bell   no
visual_bell_duration 0
window_alert_on_bell yes

# ── cursor ───────────────────────────────────────────────────────
cursor_shape          beam
cursor_beam_thickness 1.8
cursor_blink_interval 0.55
cursor_stop_blinking_after 12
cursor_trail          3
cursor_trail_decay    0.08 0.3
cursor_trail_start_threshold 3

# ── scrolling & mouse ────────────────────────────────────────────
scrollback_lines     20000
scrollbar            scrolled
scrollbar_width      0.4
scrollbar_handle_opacity 0.6
scrollbar_radius     0.3
wheel_scroll_multiplier 4.0
touch_scroll_multiplier 2.0
copy_on_select       clipboard
strip_trailing_spaces smart
mouse_hide_wait      2.0
url_style            curly
detect_urls          yes
show_hyperlink_targets yes

# ── shell integration: tells you when a long command finishes ───
shell_integration    enabled
notify_on_cmd_finish unfocused 15.0

# ── tabs: floating pills at the bottom ──────────────────────────
tab_bar_edge            bottom
tab_bar_margin_width    10.0
tab_bar_margin_height   6.0 4.0
tab_bar_style           separator
tab_separator           "  "
tab_bar_align           center
tab_bar_min_tabs        2
tab_title_template      "  {fmt.fg._807a9c}{index}{fmt.fg.tab}  {title[:28]}  "
active_tab_title_template "  {fmt.fg._0d0c13}{index}  {title[:28]}  "
active_tab_font_style   bold
inactive_tab_font_style normal

# ── Tokyo Night ──────────────────────────────────────────────────
foreground              #efeaf8
background              #13121c
selection_foreground    none
selection_background    #3a3360
url_color               #6fb8d6
cursor                  #efeaf8
cursor_text_color       #13121c
active_tab_foreground   #0d0c13
active_tab_background   #a28ae8
inactive_tab_foreground #cfc8e2
inactive_tab_background #221f33
tab_bar_background      none
active_border_color     #a28ae8
inactive_border_color   #2a2640
bell_border_color       #eec48e
scrollbar_handle_color  #a28ae8
mark1_foreground #13121c
mark1_background #a28ae8
mark2_foreground #13121c
mark2_background #e39ec0
mark3_foreground #13121c
mark3_background #7fc4e3

color0  #0a0910
color8  #403a5c
color1  #ec6f8f
color9  #f390a8
color2  #8fd6b8
color10 #b5e6d0
color3  #eec48e
color11 #f5d8aa
color4  #a28ae8
color12 #bba8f2
color5  #e39ec0
color13 #f0b9d3
color6  #7fc4e3
color14 #a5d8ee
color7  #cfc8e2
color15 #efeaf8
color16 #f2ad94
color17 #c94a6c

# ── splits (kitty's own layouts inside one window) ──────────────
enabled_layouts splits, stack
map ctrl+shift+enter launch --location=vsplit --cwd=current
map ctrl+shift+backslash launch --location=hsplit --cwd=current
map ctrl+shift+left  neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+up    neighboring_window up
map ctrl+shift+down  neighboring_window down
map ctrl+shift+z     toggle_layout stack

# ── keys ─────────────────────────────────────────────────────────
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0
map ctrl+shift+a>m   set_background_opacity +0.05
map ctrl+shift+a>l   set_background_opacity -0.05
map ctrl+shift+f     launch --type=overlay --stdin-source=@screen_scrollback fzf --no-sort --no-mouse --exact -i --tac
