# ╭──────────────────────────────────────────────────────────────╮
# │  kitty · Shinobu Kochō glass                  made by Claude │
# ╰──────────────────────────────────────────────────────────────╯

# ── font ─────────────────────────────────────────────────────────
font_family        GeistMono Nerd Font
bold_font          GeistMono Nerd Font Bold
italic_font        VictorMono Nerd Font SemiBold Italic
bold_italic_font   VictorMono Nerd Font Bold Italic
font_size          12.5
modify_font        cell_height 106%
disable_ligatures  cursor
text_composition_strategy 1.2 15

# ── window ───────────────────────────────────────────────────────
background_opacity  0.80
dynamic_background_opacity yes
window_padding_width 16 22
placement_strategy  center
hide_window_decorations yes
confirm_os_window_close 0
remember_window_size no
initial_window_width  110c
initial_window_height 30c
enable_audio_bell   no
visual_bell_duration 0
window_alert_on_bell yes

# ── cursor ───────────────────────────────────────────────────────
cursor_shape          beam
cursor_beam_thickness 1.8
cursor_blink_interval 0.55
cursor_stop_blinking_after 12
cursor_trail          3
cursor_trail_decay    0.08 0.3
cursor_trail_start_threshold 3

# ── scrolling & mouse ────────────────────────────────────────────
scrollback_lines     20000
scrollbar            scrolled
scrollbar_width      0.4
scrollbar_handle_opacity 0.6
scrollbar_radius     0.3
wheel_scroll_multiplier 4.0
touch_scroll_multiplier 2.0
copy_on_select       clipboard
strip_trailing_spaces smart
mouse_hide_wait      2.0
url_style            curly
detect_urls          yes
show_hyperlink_targets yes

# ── shell integration: tells you when a long command finishes ───
shell_integration    enabled
notify_on_cmd_finish unfocused 15.0

# ── tabs: floating pills at the bottom ──────────────────────────
tab_bar_edge            bottom
tab_bar_margin_width    10.0
tab_bar_margin_height   6.0 4.0
tab_bar_style           separator
tab_separator           "  "
tab_bar_align           center
tab_bar_min_tabs        2
tab_title_template      "  {fmt.fg._7d7299}{index}{fmt.fg.tab}  {title[:28]}  "
active_tab_title_template "  {fmt.fg._13111c}{index}  {title[:28]}  "
active_tab_font_style   bold
inactive_tab_font_style normal

# ── Tokyo Night ──────────────────────────────────────────────────
foreground              #ece4f6
background              #1a1726
selection_foreground    none
selection_background    #433463
url_color               #7fcfc4
cursor                  #ece4f6
cursor_text_color       #1a1726
active_tab_foreground   #13111c
active_tab_background   #b69cf0
inactive_tab_foreground #c9bddf
inactive_tab_background #252033
tab_bar_background      none
active_border_color     #b69cf0
inactive_border_color   #2d2640
bell_border_color       #f0c98a
scrollbar_handle_color  #b69cf0
mark1_foreground #1a1726
mark1_background #b69cf0
mark2_foreground #1a1726
mark2_background #e49bd8
mark3_foreground #1a1726
mark3_background #8fd3e0

color0  #120f19
color8  #4a3f63
color1  #f27a9e
color9  #f79ab6
color2  #9fdcc0
color10 #bfe9d4
color3  #f0c98a
color11 #f6dcaa
color4  #b69cf0
color12 #cbb4ff
color5  #e49bd8
color13 #f2b5e4
color6  #8fd3e0
color14 #b0e4ee
color7  #c9bddf
color15 #ece4f6
color16 #f5a98a
color17 #d9507a

# ── splits (kitty's own layouts inside one window) ──────────────
enabled_layouts splits, stack
map ctrl+shift+enter launch --location=vsplit --cwd=current
map ctrl+shift+backslash launch --location=hsplit --cwd=current
map ctrl+shift+left  neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+up    neighboring_window up
map ctrl+shift+down  neighboring_window down
map ctrl+shift+z     toggle_layout stack

# ── keys ─────────────────────────────────────────────────────────
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0
map ctrl+shift+a>m   set_background_opacity +0.05
map ctrl+shift+a>l   set_background_opacity -0.05
map ctrl+shift+f     launch --type=overlay --stdin-source=@screen_scrollback fzf --no-sort --no-mouse --exact -i --tac
