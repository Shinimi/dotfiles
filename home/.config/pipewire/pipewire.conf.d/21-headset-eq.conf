# "Headset EQ": 6-band EQ in front of the Fuxi-H3. Presets are applied live by ~/.local/bin/audio-fx.sh. Made by Claude.
context.modules = [
  { name = libpipewire-module-filter-chain
    flags = [ nofail ]
    args = {
      node.description = "Headset EQ"
      media.name       = "Headset EQ"
      filter.graph = {
        nodes = [
          { type = builtin name = pre    label = linear       control = { "Mult" = 1.0 "Add" = 0.0 } }
          { type = builtin name = low    label = bq_lowshelf  control = { "Freq" = 100.0  "Q" = 0.8 "Gain" = 0.0 } }
          { type = builtin name = lowmid label = bq_peaking   control = { "Freq" = 250.0  "Q" = 1.0 "Gain" = 0.0 } }
          { type = builtin name = mid    label = bq_peaking   control = { "Freq" = 1000.0 "Q" = 1.0 "Gain" = 0.0 } }
          { type = builtin name = upmid  label = bq_peaking   control = { "Freq" = 2500.0 "Q" = 1.0 "Gain" = 0.0 } }
          { type = builtin name = pres   label = bq_peaking   control = { "Freq" = 5000.0 "Q" = 1.0 "Gain" = 0.0 } }
          { type = builtin name = high   label = bq_highshelf control = { "Freq" = 8000.0 "Q" = 0.8 "Gain" = 0.0 } }
        ]
        links = [
          { output = "pre:Out"    input = "low:In" }
          { output = "low:Out"    input = "lowmid:In" }
          { output = "lowmid:Out" input = "mid:In" }
          { output = "mid:Out"    input = "upmid:In" }
          { output = "upmid:Out"  input = "pres:In" }
          { output = "pres:Out"   input = "high:In" }
        ]
      }
      audio.channels = 2
      audio.position = [ FL FR ]
      capture.props = {
        node.name   = "headset_eq"
        node.description = "Headset EQ"
        media.class = Audio/Sink
      }
      playback.props = {
        node.name     = "effect_output.headset_eq"
        node.passive  = true
        target.object = "alsa_output.usb-XiiSound_Technology_Corporation_Fuxi-H3-00.playback.0.0"
      }
    }
  }
]
