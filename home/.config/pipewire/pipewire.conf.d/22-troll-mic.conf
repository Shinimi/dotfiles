# "Troll mic": your Clean mic through a voice changer (pitch, ring modulator, bit crusher, drive, GSM glitch,
# radio filters), always ending in a safety limiter so nobody's ears get hurt. The voice (preset) is set live by
# audio-fx.sh; switch to it with SUPER + ALT + T or the control center. Made by Claude.
context.modules = [
  { name = libpipewire-module-filter-chain
    flags = [ nofail ]
    args = {
      node.description = "Troll mic"
      media.name       = "Troll mic"
      filter.graph = {
        nodes = [
          { type = builtin name = hp    label = bq_highpass control = { "Freq" = 20.0  "Q" = 0.7 } }
          { type = builtin name = lp    label = bq_lowpass  control = { "Freq" = 20000.0 "Q" = 0.7 } }
          { type = ladspa  name = pitch plugin = "pitch_scale_1194" label = pitchScaleHQ control = { "Pitch co-efficient" = 1.0 } }
          { type = ladspa  name = ring  plugin = "ringmod_1188" label = ringmod_1i1o1l
            control = { "Modulation depth (0=none, 1=AM, 2=RM)" = 0.0 "Frequency (Hz)" = 50.0 "Sine level" = 1.0 "Triangle level" = 0.0 "Sawtooth level" = 0.0 "Square level" = 0.0 } }
          { type = ladspa  name = crush plugin = "decimator_1202" label = decimator control = { "Bit depth" = 24.0 "Sample rate (Hz)" = 48000.0 } }
          { type = ladspa  name = drive plugin = "foverdrive_1196" label = foverdrive control = { "Drive level" = 1.0 } }
          { type = ladspa  name = gsm   plugin = "gsm_1215" label = gsm control = { "Dry/wet mix" = 0.0 "Number of passes" = 1.0 "Error rate (bits/block)" = 0.0 } }
          { type = ladspa  name = lim   plugin = "fast_lookahead_limiter_1913" label = fastLookaheadLimiter
            control = { "Input gain (dB)" = 0.0 "Limit (dB)" = -3.0 "Release time (s)" = 0.08 } }
        ]
        links = [
          { output = "hp:Out"       input = "lp:In" }
          { output = "lp:Out"       input = "pitch:Input" }
          { output = "pitch:Output" input = "ring:Input" }
          { output = "ring:Output"  input = "crush:Input" }
          { output = "crush:Output" input = "drive:Input" }
          { output = "drive:Output" input = "gsm:Input" }
          { output = "gsm:Output"   input = "lim:Input 1" }
        ]
        inputs  = [ "hp:In" ]
        outputs = [ "lim:Output 1" ]
      }
      audio.position = [ MONO ]
      capture.props = {
        node.name      = "effect_input.troll_mic"
        node.passive   = true
        target.object  = "clean_mic"
      }
      playback.props = {
        node.name        = "troll_mic"
        node.description = "Troll mic"
        media.class      = Audio/Source
      }
    }
  }
]
