# "Clean mic": the Fuxi-H3 microphone through RNNoise (AI noise removal). Made by Claude.
# Toggle it in the control center (it becomes / stops being the default mic).
context.modules = [
  { name = libpipewire-module-filter-chain
    flags = [ nofail ]
    args = {
      node.description = "Clean mic"
      media.name       = "Clean mic"
      filter.graph = {
        nodes = [
          { type = ladspa  name = rnnoise  plugin = "librnnoise_ladspa"  label = noise_suppressor_mono
            control = { "VAD Threshold (%)" 60.0  "VAD Grace Period (ms)" 200  "Retroactive VAD Grace (ms)" 0 } }
        ]
      }
      audio.position = [ MONO ]
      capture.props = {
        node.name      = "effect_input.clean_mic"
        node.passive   = true
        target.object  = "alsa_input.usb-XiiSound_Technology_Corporation_Fuxi-H3-00.capture.0.0"
      }
      playback.props = {
        node.name      = "clean_mic"
        node.description = "Clean mic"
        media.class    = Audio/Source
      }
    }
  }
]
