# MangoHud – full overlay (mono, square). Toggle: Right Shift + F12. Made by Claude.
# gamemode.sh copies this to MangoHud.conf per game; "FPS only" uses fps-only.conf instead.
no_display
toggle_hud=Shift_R+F12
position=top-left
offset_x=12
offset_y=12
font_size=17
font_size_text=17
# the font lives in $HOME: Steam's game sandbox can't see /usr/share/fonts
font_file=/home/yu/.config/MangoHud/fonts/JetBrainsMonoNerdFont-SemiBold.ttf
round_corners=0
background_alpha=0.82
background_color=050505
table_columns=4
cellpadding_y=0.1
text_color=ffffff
text_outline=0
fps
fps_text=FPS
fps_color_change
fps_value=45,90
fps_color=cf6b6b,e0e0e0,ffffff
engine_color=9a9a9a
frametime
frame_timing
frame_timing_height=36
frametime_color=9a9a9a
gpu_stats
gpu_temp
gpu_power
gpu_text=GPU
gpu_color=ffffff
cpu_stats
cpu_temp
cpu_mhz
cpu_text=CPU
cpu_color=ffffff
vram
vram_color=9a9a9a
ram
ram_color=9a9a9a

# session logs for the control center's Games page (average FPS). One line a second, the last 20 kept. Made by Claude.
output_folder=/home/yu/.local/state/mangohud-logs
autostart_log=10
log_interval=1000
