# MangoHud – "FPS only": one small FPS chip, same look as the full overlay. Made by Claude.
toggle_hud=Shift_R+F12
position=top-left
offset_x=12
offset_y=12
font_size=20
# the font lives in $HOME: Steam's game sandbox can't see /usr/share/fonts
font_file=/home/yu/.config/MangoHud/fonts/JetBrainsMonoNerdFont-SemiBold.ttf
round_corners=0
background_alpha=0.82
background_color=050505
text_color=ffffff
text_outline=0
horizontal
horizontal_stretch=0
hud_compact
fps
fps_text=FPS
fps_color_change
fps_value=45,90
fps_color=cf6b6b,e0e0e0,ffffff
engine_color=9a9a9a
frametime=0
frame_timing=0
gpu_stats=0
cpu_stats=0

output_folder=/home/yu/.local/state/mangohud-logs
autostart_log=10
log_interval=1000
