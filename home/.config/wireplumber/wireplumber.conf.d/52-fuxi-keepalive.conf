# Keep the Fuxi-H3 2.4 GHz headset awake. Made by Claude. Delete this file to revert.
# The headset powers itself off when the dongle stops receiving audio; this keeps
# the output stream open and adds an inaudible noise floor (~-90 dB) so it never sees pure silence.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.usb-XiiSound_Technology_Corporation_Fuxi-H3.*" } ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        node.pause-on-idle             = false
        node.always-process            = true
        dither.noise                   = 2
      }
    }
  }
]
