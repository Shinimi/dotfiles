# starship · Shinobu Kochō — a butterfly, the folder, git. Made by Claude.
add_newline = true
format = """[󱖉](bold #e39ec0) $directory$git_branch$git_status$cmd_duration
$character"""

[directory]
style = "bold #a28ae8"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "#ec6f8f"
home_symbol = "~"

[git_branch]
symbol = " "
style = "#7fc4e3"
format = "[$symbol$branch]($style) "

[git_status]
style = "#eec48e"
format = "[($all_status$ahead_behind )]($style)"

[cmd_duration]
min_time = 2000
style = "italic #807a9c"
format = "[ $duration]($style)"

[character]
success_symbol = "[❯](#e39ec0)"
error_symbol = "[❯](#ec6f8f)"
vimcmd_symbol = "[❮](#8fd6b8)"
