# Monochrome on-screen display for mpv (also used by live wallpapers). Made by Claude.
osd-font='JetBrainsMono Nerd Font'
osd-font-size=30
osd-color='#EAEAEA'
osd-border-color='#E6000000'
osd-border-size=2
osd-shadow-offset=0
osd-bar-align-y=0.92
osd-bar-h=1.6
osd-bar-w=60
osd-bar-border-size=0.6
osd-back-color='#B3111111'
sub-font='Inter'
sub-color='#F2F2F2'
sub-border-color='#E6000000'
sub-border-size=2.5
sub-shadow-offset=0
keep-open=yes
hwdec=auto-safe
