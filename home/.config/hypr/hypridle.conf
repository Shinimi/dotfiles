# Idle behaviour (desktop). Made by Claude.
general {
    lock_cmd = pidof hyprlock || { playerctl -a pause; hyprlock; }
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
listener {
    timeout = 720                                  # 12 min: screensaver
    on-timeout = qs ipc -p ~/.config/quickshell/bar call screensaver start
    on-resume = qs ipc -p ~/.config/quickshell/bar call screensaver stop
}
listener {
    timeout = 1500                                  # 25 min: lock
    on-timeout = loginctl lock-session
}
listener {
    timeout = 1800                                  # 30 min: screens off
    on-timeout = ~/.config/hypr/scripts/screens-off.sh
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
# No auto-suspend on purpose (gaming desktop). Fullscreen games/videos block idle entirely.
