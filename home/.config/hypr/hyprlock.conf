# ╭──────────────────────────────────────────────────────────────╮
# │  hyprlock · 胡蝶しのぶ                                         │
# │  The art stays sharp; time, name and password float in the    │
# │  dark space on the right. No panels.          made by Claude  │
# ╰──────────────────────────────────────────────────────────────╯
$font = GeistMono Nerd Font
$jp   = Noto Serif CJK JP
$info = ~/.config/hypr/scripts/lock-info.sh

general {
    hide_cursor = true
    ignore_empty_input = true
    grace = 0
}

animations {
    enabled = true
    bezier = ease, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 5, ease
    animation = fadeOut, 1, 3, ease
    animation = inputFieldDots, 1, 2, ease
    animation = inputFieldColors, 1, 3, ease
}

background {
    monitor = DP-1
    path = /home/yu/Pictures/wallpaper/shinobu-uhd-00.jpg
    blur_passes = 0
    brightness = 0.85
    vibrancy = 0.1
}
background {
    monitor = DP-2
    path = /home/yu/Pictures/wallpaper/shinobu-uhd-31.jpg
    blur_passes = 3
    blur_size = 6
    brightness = 0.4
}

# ── right side of the main screen ───────────────────────────
label {   # her name, vertical, like a seal
    monitor = DP-1
    text = 胡<br/>蝶<br/>し<br/>の<br/>ぶ
    color = rgba(e39ec0ee)
    font_size = 26
    font_family = $jp Bold
    position = -120, 120
    halign = right
    valign = center
}
label {   # clock
    monitor = DP-1
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(efeaf8ff)
    font_size = 132
    font_family = $font Light
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0d0c1399)
    position = -265, 210
    halign = right
    valign = center
}
label {   # date
    monitor = DP-1
    text = cmd[update:60000] LC_TIME=C date +"%A  ·  %d %B" | tr '[:upper:]' '[:lower:]'
    color = rgba(a28ae8ff)
    font_size = 17
    font_family = $font
    position = -272, 95
    halign = right
    valign = center
}
shape {   # thin divider
    monitor = DP-1
    size = 360, 1
    color = rgba(e39ec055)
    position = -275, 50
    halign = right
    valign = center
}
input-field {
    monitor = DP-1
    size = 360, 50
    outline_thickness = 1
    inner_color = rgba(0d0c13aa)
    outer_color = rgba(a28ae888) rgba(e39ec088) 45deg
    check_color = rgb(7fc4e3)
    fail_color = rgb(ec6f8f)
    capslock_color = rgb(eec48e)
    font_color = rgb(efeaf8)
    fade_on_empty = false
    rounding = 25
    font_family = $font
    placeholder_text = <span foreground="##807a9c">󱖉   password</span>
    fail_text = <span foreground="##ec6f8f">$PAMFAIL</span>
    dots_size = 0.2
    dots_spacing = 0.4
    dots_center = true
    position = -275, -10
    halign = right
    valign = center
}
label {   # now playing
    monitor = DP-1
    text = cmd[update:2000] $info music
    color = rgba(e39ec0cc)
    font_size = 12
    font_family = $font
    position = -120, 90
    halign = right
    valign = bottom
}
label {   # weather
    monitor = DP-1
    text = cmd[update:900000] $info weather
    color = rgba(efeaf899)
    font_size = 12
    font_family = $font
    position = -120, 56
    halign = right
    valign = bottom
}

# ── side screen ─────────────────────────────────────────────
label {
    monitor = DP-2
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(efeaf8bb)
    font_size = 64
    font_family = $font Light
    position = 0, 0
    halign = center
    valign = center
}
