# Lock screen (Tokyo Night). Made by Claude.
$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 4, linear
    animation = fadeOut, 1, 4, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = /home/yu/Pictures/wallpaper/TN3.png
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
}

input-field {
    monitor = DP-1
    size = 18%, 5%
    outline_thickness = 2
    inner_color = rgb(1a1b26)
    outer_color = rgb(7aa2f7) rgb(bb9af7) 45deg
    check_color = rgb(9ece6a)
    fail_color = rgb(f7768e)
    font_color = rgb(c0caf5)
    fade_on_empty = false
    rounding = 10
    font_family = $font
    placeholder_text = <span foreground="##565f89">password…</span>
    fail_text = $PAMFAIL
    dots_spacing = 0.3
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor = DP-1
    text = $TIME
    color = rgb(c0caf5)
    font_size = 96
    font_family = $font
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor = DP-1
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(7aa2f7)
    font_size = 22
    font_family = $font
    position = 0, 70
    halign = center
    valign = center
}
