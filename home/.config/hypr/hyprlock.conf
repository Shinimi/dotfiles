# ╭──────────────────────────────────────────────────────────────╮
# │  hyprlock · monochrome — torii at night. Clock in the sky,    │
# │  password on the shore. No panels.            made by Claude  │
# ╰──────────────────────────────────────────────────────────────╯
$font = GeistMono Nerd Font
$info = ~/.config/hypr/scripts/lock-info.sh

general {
    hide_cursor = true
    ignore_empty_input = true
}
animations {
    enabled = true
    bezier = ease, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 5, ease
    animation = fadeOut, 1, 3, ease
    animation = inputFieldDots, 1, 2, ease
    animation = inputFieldColors, 1, 3, ease
}

background {
    monitor = DP-1
    path = /home/yu/Pictures/wallpaper/mono-torii-night.jpg
    blur_passes = 0
    brightness = 0.9
}
background {
    monitor = DP-2
    path = /home/yu/Pictures/wallpaper/mono-peak.jpg
    blur_passes = 3
    blur_size = 6
    brightness = 0.45
}

label {   # clock
    monitor = DP-1
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(f5f5f5ff)
    font_size = 140
    font_family = $font Thin
    position = 0, 380
    halign = center
    valign = center
}
label {   # date
    monitor = DP-1
    text = cmd[update:60000] LC_TIME=C date +"%A   %d %B" | tr '[:lower:]' '[:upper:]' | sed 's/./& /g'
    color = rgba(b0b0b0ff)
    font_size = 13
    font_family = $font
    position = 0, 250
    halign = center
    valign = center
}
input-field {
    monitor = DP-1
    size = 360, 48
    outline_thickness = 1
    inner_color = rgba(0b0b0bb3)
    outer_color = rgba(ffffff33)
    check_color = rgba(ffffffcc)
    fail_color = rgb(cf6b6b)
    capslock_color = rgb(d6d6d6)
    font_color = rgb(eaeaea)
    fade_on_empty = false
    rounding = 24
    font_family = $font
    placeholder_text = <span foreground="##7a7a7a">password</span>
    fail_text = <span foreground="##cf6b6b">$PAMFAIL</span>
    dots_size = 0.18
    dots_spacing = 0.45
    dots_center = true
    position = 0, -330
    halign = center
    valign = center
}
label {   # now playing · weather
    monitor = DP-1
    text = cmd[update:2000] echo "$($info music)"
    color = rgba(ffffff88)
    font_size = 11
    font_family = $font
    position = 0, 70
    halign = center
    valign = bottom
}
label {
    monitor = DP-1
    text = cmd[update:900000] $info weather
    color = rgba(ffffff55)
    font_size = 11
    font_family = $font
    position = 0, 44
    halign = center
    valign = bottom
}

label {
    monitor = DP-2
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(eaeaeabb)
    font_size = 64
    font_family = $font Thin
    position = 0, 0
    halign = center
    valign = center
}
