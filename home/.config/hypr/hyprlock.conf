# Lock screen – Tokyo Night glass. Made by Claude.
$font  = JetBrainsMono Nerd Font
$thin  = JetBrainsMono Nerd Font Light
$info  = ~/.config/hypr/scripts/lock-info.sh

general {
    hide_cursor = true
    ignore_empty_input = true
    grace = 0
}

animations {
    enabled = true
    bezier = ease, 0.25, 1, 0.5, 1
    animation = fadeIn, 1, 5, ease
    animation = fadeOut, 1, 4, ease
    animation = inputFieldDots, 1, 2, ease
    animation = inputFieldColors, 1, 4, ease
}

# wallpapers, blurred and dimmed (kept in sync by the wallpaper picker)
background {
    monitor = DP-1
    path = /home/yu/Pictures/wallpaper/TN3.png
    blur_passes = 4
    blur_size = 7
    brightness = 0.55
    contrast = 0.95
    vibrancy = 0.2
    noise = 0.012
}
background {
    monitor = DP-2
    path = /home/yu/Pictures/wallpaper/TN8.png
    blur_passes = 4
    blur_size = 7
    brightness = 0.45
    vibrancy = 0.2
}

# ── main screen ──────────────────────────────────────────────
label {   # greeting
    monitor = DP-1
    text = cmd[update:600000] $info greeting
    color = rgba(c0caf5cc)
    font_size = 20
    font_family = $font
    position = 0, 330
    halign = center
    valign = center
}
label {   # clock
    monitor = DP-1
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(c0caf5)
    font_size = 150
    font_family = $font ExtraBold
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(7aa2f766)
    position = 0, 190
    halign = center
    valign = center
}
label {   # date
    monitor = DP-1
    text = cmd[update:60000] date +"%A · %d %B"
    color = rgb(7aa2f7)
    font_size = 22
    font_family = $font
    position = 0, 60
    halign = center
    valign = center
}
shape {   # glass card behind the password box
    monitor = DP-1
    size = 460, 130
    color = rgba(1a1b2699)
    rounding = 22
    border_size = 1
    border_color = rgba(7aa2f744)
    position = 0, -100
    halign = center
    valign = center
}
input-field {
    monitor = DP-1
    size = 380, 56
    outline_thickness = 2
    inner_color = rgba(16161ecc)
    outer_color = rgb(7aa2f7) rgb(bb9af7) rgb(7dcfff) 45deg
    check_color = rgb(9ece6a) rgb(73daca) 45deg
    fail_color = rgb(f7768e) rgb(ff9e64) 45deg
    capslock_color = rgb(e0af68)
    font_color = rgb(c0caf5)
    fade_on_empty = false
    rounding = 16
    font_family = $font
    placeholder_text = <span foreground="##565f89">󰌾  password</span>
    fail_text = <span foreground="##f7768e">$PAMFAIL</span>
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    position = 0, -86
    halign = center
    valign = center
}
label {   # caps lock / layout hint under the field
    monitor = DP-1
    text = $LAYOUT[,]
    color = rgba(565f89ff)
    font_size = 11
    font_family = $font
    position = 0, -138
    halign = center
    valign = center
}
label {   # weather, bottom left
    monitor = DP-1
    text = cmd[update:900000] $info weather
    color = rgba(c0caf5dd)
    font_size = 15
    font_family = $font
    position = 40, 36
    halign = left
    valign = bottom
}
label {   # now playing, bottom centre
    monitor = DP-1
    text = cmd[update:2000] $info music
    color = rgb(9ece6a)
    font_size = 14
    font_family = $font
    position = 0, 40
    halign = center
    valign = bottom
}
label {   # host, bottom right
    monitor = DP-1
    text = 󰣇  $USER@cachyos
    color = rgba(565f89ff)
    font_size = 13
    font_family = $font
    position = -40, 36
    halign = right
    valign = bottom
}

# ── side screen: just a quiet clock ─────────────────────────
label {
    monitor = DP-2
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(c0caf5aa)
    font_size = 64
    font_family = $font Bold
    position = 0, 0
    halign = center
    valign = center
}
