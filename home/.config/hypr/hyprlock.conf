# ╭──────────────────────────────────────────────────────────────────────────╮
# │  hyprlock · "Monolith" — the lock screen as the login screen's twin:      │
# │  the same ASCII landscape, a giant stacked clock on the left (hours solid, │
# │  minutes ghosted) with the date and today's quote, and a sign-in card on   │
# │  the right. A status line along the bottom.                    by Claude   │
# ╰──────────────────────────────────────────────────────────────────────────╯
$font = JetBrainsMono Nerd Font
$info = ~/.config/hypr/scripts/lock-info.sh

general {
    hide_cursor = true
    ignore_empty_input = true
}
animations {
    enabled = true
    bezier = ease, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 6, ease
    animation = fadeOut, 1, 3, ease
    animation = inputFieldDots, 1, 2, ease
    animation = inputFieldColors, 1, 3, ease
    animation = inputFieldWidth, 1, 3, ease
}

# ---------- the login screen's ASCII landscape (main) and its quiet twin (side) ----------
background {
    monitor = DP-1
    path = ~/.config/hypr/lock/ascii-lock.png
    blur_passes = 0
    brightness = 1.0
}
background {
    monitor = DP-2
    path = /home/yu/Pictures/wallpaper/mono-torii-night.jpg
    blur_passes = 2
    blur_size = 6
    brightness = 0.45
}

# ================= left: day, the stacked clock, a rail, date, quote =================
shape {   # the thin vertical rule the clock hangs from
    monitor = DP-1
    size = 1, 560
    color = rgba(ffffff26)
    position = 86, 0
    halign = left
    valign = center
}
label {
    monitor = DP-1
    text = cmd[update:60000] echo "<span letter_spacing='3200'><b>$(LC_ALL=en_US.UTF-8 date +%A | tr '[:lower:]' '[:upper:]')</b></span>"
    color = rgba(ffffff80)
    font_size = 10
    font_family = $font
    position = 120, 262
    halign = left
    valign = center
}
label {   # hours: solid
    monitor = DP-1
    text = cmd[update:1000] date +"%H"
    color = rgba(ffffffff)
    font_size = 150
    font_family = $font ExtraBold
    position = 112, 128
    halign = left
    valign = center
}
label {   # minutes: ghosted
    monitor = DP-1
    text = cmd[update:1000] date +"%M"
    color = rgba(ffffff38)
    font_size = 150
    font_family = $font ExtraBold
    position = 112, -78
    halign = left
    valign = center
}
shape {   # the seconds rail
    monitor = DP-1
    size = 420, 1
    color = rgba(ffffff33)
    position = 120, -188
    halign = left
    valign = center
}
label {   # the seconds dot travels along it
    monitor = DP-1
    text = cmd[update:1000] s=$(date +%-S); printf '%*s●' $(( s * 34 / 60 )) ''
    color = rgba(ffffffff)
    font_size = 9
    font_family = $font
    position = 116, -187
    halign = left
    valign = center
}
label {
    monitor = DP-1
    text = cmd[update:60000] LC_ALL=en_US.UTF-8 date +"%-d %B %Y"
    color = rgba(f0f0f0ff)
    font_size = 20
    font_family = $font Medium
    position = 120, -232
    halign = left
    valign = center
}
label {
    monitor = DP-1
    text = cmd[update:3600000] $info line | sed 's/  —.*//'
    color = rgba(ffffffc0)
    font_size = 14
    font_family = $font Italic
    position = 120, -284
    halign = left
    valign = center
}
label {
    monitor = DP-1
    text = cmd[update:3600000] $info line | sed -n 's/.*  — /— /p'
    color = rgba(ffffff70)
    font_size = 11
    font_family = $font
    position = 120, -316
    halign = left
    valign = center
}

# ================= right: the sign-in card =================
shape {   # card
    monitor = DP-1
    size = 470, 430
    color = rgba(0b0b0bf0)
    rounding = 4
    border_size = 1
    border_color = rgba(ffffff1f)
    position = -120, -10
    halign = right
    valign = center
    zindex = 1
}

shape {   # its bright top seam
    monitor = DP-1
    size = 470, 2
    color = rgba(ffffffff)
    position = -120, 204
    halign = right
    valign = center
    zindex = 1
}

label {
    monitor = DP-1
    text = <span letter_spacing='2600'><b>●  LOCKED</b>   <span foreground='##6a6a6a'>HYPRLAND</span></span>
    color = rgba(ffffffcc)
    font_size = 9
    font_family = $font
    position = -404, 170
    halign = right
    valign = center
    zindex = 2
}

image {
    monitor = DP-1
    path = ~/.face
    size = 84
    rounding = -1
    border_size = 1
    border_color = rgba(ffffff40)
    position = -470, 96
    halign = right
    valign = center
    zindex = 2
}

label {
    monitor = DP-1
    text = cmd[update:60000] $info greeting | sed 's/, .*/,/'
    color = rgba(ffffff8c)
    font_size = 12
    font_family = $font
    position = -284, 112
    halign = right
    valign = center
    zindex = 2
}

label {
    monitor = DP-1
    text = cmd[update:3600000] echo "$USER" | sed -E 's/^(.)(.*)$/\U\1\L\2/'
    color = rgba(ffffffff)
    font_size = 26
    font_family = $font Bold
    position = -330, 76
    halign = right
    valign = center
    zindex = 2
}

label {
    monitor = DP-1
    text = <span letter_spacing='2400'><b>PASSWORD</b></span>
    color = rgba(ffffff70)
    font_size = 8
    font_family = $font
    position = -488, 4
    halign = right
    valign = center
    zindex = 2
}

input-field {
    monitor = DP-1
    size = 406, 54
    outline_thickness = 1
    inner_color = rgba(111111ff)
    outer_color = rgba(ffffff2e)
    check_color = rgba(ffffffcc)
    fail_color = rgb(cf6b6b)
    capslock_color = rgb(ffffff)
    font_color = rgb(f0f0f0)
    fade_on_empty = false
    rounding = 3
    font_family = $font
    placeholder_text = <span foreground="##5a5a5a">󰌾   Type your password</span>
    fail_text = <span foreground="##cf6b6b">$PAMFAIL</span>
    dots_size = 0.2
    dots_spacing = 0.5
    dots_rounding = 1
    dots_center = false
    position = -152, -42
    halign = right
    valign = center
    zindex = 2
}

label {
    monitor = DP-1
    text = <span foreground='##d0d0d0'>›</span>  Press Enter to unlock
    color = rgba(ffffff8c)
    font_size = 10
    font_family = $font
    position = -385, -98
    halign = right
    valign = center
    zindex = 2
}

shape {
    monitor = DP-1
    size = 406, 1
    color = rgba(ffffff1a)
    position = -152, -134
    halign = right
    valign = center
    zindex = 2
}

label {
    monitor = DP-1
    text = <span background='##1c1c1c' foreground='##d0d0d0'> Enter </span>  unlock     <span background='##1c1c1c' foreground='##d0d0d0'> Esc </span>  clear
    color = rgba(ffffff70)
    font_size = 9
    font_family = $font
    position = -342, -166
    halign = right
    valign = center
    zindex = 2
}

# ================= bottom: a status line =================
shape {
    monitor = DP-1
    size = 2460, 1
    color = rgba(ffffff1a)
    position = 0, 92
    halign = center
    valign = bottom
}
label {   # what's playing (empty when nothing is)
    monitor = DP-1
    text = cmd[update:2000] m=$($info music); [ -n "$m" ] && echo "<span foreground='##6a6a6a' letter_spacing='1600'><b>NOW PLAYING</b></span>   $m"
    color = rgba(ffffffcc)
    font_size = 10
    font_family = $font
    position = 50, 48
    halign = left
    valign = bottom
}
label {
    monitor = DP-1
    text = <b>  CachyOS</b>
    color = rgba(ffffffd0)
    font_size = 11
    font_family = $font
    position = 0, 56
    halign = center
    valign = bottom
}
label {
    monitor = DP-1
    text = Ryzen 7 5700X  ·  Radeon RX 9060 XT  ·  32 GB
    color = rgba(ffffff59)
    font_size = 8
    font_family = $font
    position = 0, 34
    halign = center
    valign = bottom
}
label {
    monitor = DP-1
    text = cmd[update:30000] python3 -I -c "import json,os;d=json.load(open(os.path.expanduser('~/.local/state/mouse-battery.json')));v=d.get('level',d.get('percent',''));print(f'󰍽  {v}%' if v!='' else '')" 2>/dev/null
    color = rgba(ffffff8c)
    font_size = 10
    font_family = $font
    position = -50, 48
    halign = right
    valign = bottom
}

# ---------- side screen: just the stacked clock, quiet ----------
label {
    monitor = DP-2
    text = cmd[update:1000] date +"%H"
    color = rgba(ffffffee)
    font_size = 72
    font_family = $font ExtraBold
    position = 70, 150
    halign = left
    valign = bottom
}
label {
    monitor = DP-2
    text = cmd[update:1000] date +"%M"
    color = rgba(ffffff38)
    font_size = 72
    font_family = $font ExtraBold
    position = 70, 50
    halign = left
    valign = bottom
}
