# ╭──────────────────────────────────────────────────────────────╮
# │  hyprlock · island — the same black glass pill as the bar,    │
# │  a thin clock, today's line, password in a pill.  by Claude   │
# ╰──────────────────────────────────────────────────────────────╯
$font = JetBrainsMono Nerd Font
$info = ~/.config/hypr/scripts/lock-info.sh

general {
    hide_cursor = true
    ignore_empty_input = true
}
animations {
    enabled = true
    bezier = ease, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 6, ease
    animation = fadeOut, 1, 3, ease
    animation = inputFieldDots, 1, 2, ease
    animation = inputFieldColors, 1, 3, ease
    animation = inputFieldWidth, 1, 3, ease
}

background {
    monitor = DP-1
    path = /home/yu/Pictures/wallpaper/mono-torii-night.jpg
    blur_passes = 0
    brightness = 0.72
}
background {
    monitor = DP-2
    path = /home/yu/Pictures/wallpaper/mono-ring.jpg
    blur_passes = 3
    blur_size = 7
    brightness = 0.4
}

# ---------- the island ----------
shape {
    monitor = DP-1
    size = 420, 34
    color = rgba(050505e6)
    rounding = -1
    border_size = 1
    border_color = rgba(ffffff16)
    position = 0, -6
    halign = center
    valign = top
}
label {
    monitor = DP-1
    text = cmd[update:30000] $info island
    color = rgba(e8e8e8ff)
    font_size = 11
    font_family = $font
    position = 0, -14
    halign = center
    valign = top
}

# ---------- clock ----------
label {
    monitor = DP-1
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(f5f5f5ff)
    font_size = 150
    font_family = $font Thin
    position = 0, 420
    halign = center
    valign = center
}
label {
    monitor = DP-1
    text = cmd[update:60000] LC_TIME=C date +"%A, %-d %B" | tr '[:upper:]' '[:lower:]'
    color = rgba(b0b0b0ff)
    font_size = 16
    font_family = $font
    position = 0, 292
    halign = center
    valign = center
}
label {
    monitor = DP-1
    text = cmd[update:3600000] $info line
    color = rgba(ffffff66)
    font_size = 12
    font_family = $font Italic
    position = 0, 254
    halign = center
    valign = center
}

# ---------- you + password ----------
image {
    monitor = DP-1
    path = /home/yu/.face
    size = 74
    rounding = -1
    border_size = 1
    border_color = rgba(ffffff26)
    position = 0, -385
    halign = center
    valign = center
}
input-field {
    monitor = DP-1
    size = 300, 44
    outline_thickness = 1
    inner_color = rgba(050505e6)
    outer_color = rgba(ffffff16)
    check_color = rgba(ffffff66)
    fail_color = rgb(cf6b6b)
    capslock_color = rgb(d6d6d6)
    font_color = rgb(eaeaea)
    fade_on_empty = false
    rounding = -1
    font_family = $font
    placeholder_text = <span foreground="##6a6a6a">password</span>
    fail_text = <span foreground="##cf6b6b">$PAMFAIL</span>
    dots_size = 0.2
    dots_spacing = 0.5
    dots_center = true
    position = 0, -475
    halign = center
    valign = center
}

# ---------- now playing (only while music plays) ----------
label {
    monitor = DP-1
    text = cmd[update:2000] echo "$($info music)"
    color = rgba(ffffff80)
    font_size = 11
    font_family = $font
    position = 0, 48
    halign = center
    valign = bottom
}

# ---------- side screen ----------
label {
    monitor = DP-2
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(eaeaeaaa)
    font_size = 64
    font_family = $font Thin
    position = 0, 0
    halign = center
    valign = center
}
