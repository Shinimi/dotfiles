# ╭──────────────────────────────────────────────────────────────────────────╮
# │  hyprlock · "Frosted"  — your own desktop behind heavy frosted glass.    │
# │  A huge clock low on the left, the date and a greeting above it,         │
# │  today's quote below; what's playing top right; the password bottom      │
# │  right. Deliberately nothing like the login screen.        by Claude     │
# ╰──────────────────────────────────────────────────────────────────────────╯
$font = JetBrainsMono Nerd Font
$info = ~/.config/hypr/scripts/lock-info.sh

general {
    hide_cursor = true
    ignore_empty_input = true
}
animations {
    enabled = true
    bezier = ease, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 7, ease
    animation = fadeOut, 1, 3, ease
    animation = inputFieldDots, 1, 2, ease
    animation = inputFieldColors, 1, 3, ease
    animation = inputFieldWidth, 1, 3, ease
}

# ---------- frosted desktop ----------
background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 9
    noise = 0.02
    brightness = 0.32
    contrast = 0.9
    vibrancy = 0
}

# ---------- top: a small tag left, what's playing right ----------
label {
    monitor = DP-1
    text = <span letter_spacing="3200"><b>󰌾  LOCKED</b></span>
    color = rgba(ffffffb0)
    font_size = 10
    font_family = $font
    position = 110, -70
    halign = left
    valign = top
}
label {
    monitor = DP-1
    text = cmd[update:2000] echo "$($info music)"
    color = rgba(ffffffb0)
    font_size = 11
    font_family = $font
    position = -110, -68
    halign = right
    valign = top
}
shape {
    monitor = DP-1
    size = 2340, 1
    color = rgba(ffffff1f)
    position = 0, -110
    halign = center
    valign = top
}

# ---------- bottom left: greeting, date, the big clock, the quote ----------
label {
    monitor = DP-1
    text = cmd[update:60000] echo "$($info greeting)"
    color = rgba(ffffffff)
    font_size = 26
    font_family = $font SemiBold
    position = 110, 420
    halign = left
    valign = bottom
}
label {
    monitor = DP-1
    text = cmd[update:60000] echo "<span letter_spacing='2400'>$($info date | tr '[:lower:]' '[:upper:]')</span>"
    color = rgba(ffffff80)
    font_size = 11
    font_family = $font Bold
    position = 112, 384
    halign = left
    valign = bottom
}
label {
    monitor = DP-1
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(ffffffff)
    font_size = 190
    font_family = $font ExtraBold
    position = 92, 96
    halign = left
    valign = bottom
}
label {
    monitor = DP-1
    text = cmd[update:3600000] echo "$($info line)"
    color = rgba(ffffff8c)
    font_size = 13
    font_family = $font Italic
    position = 112, 84
    halign = left
    valign = bottom
}

# ---------- bottom right: you + the password ----------
image {
    monitor = DP-1
    path = /home/yu/.face
    size = 64
    rounding = 10
    border_size = 0
    position = 2020, 196
    halign = left
    valign = bottom
}
label {
    monitor = DP-1
    text = Welcome back
    color = rgba(ffffff80)
    font_size = 11
    font_family = $font
    position = 2100, 234
    halign = left
    valign = bottom
}
label {
    monitor = DP-1
    text = cmd[update:3600000] echo "$USER" | sed -E 's/^(.)(.*)$/\U\1\L\2/'
    color = rgba(ffffffff)
    font_size = 20
    font_family = $font Bold
    position = 2100, 198
    halign = left
    valign = bottom
}
input-field {
    monitor = DP-1
    size = 430, 62
    outline_thickness = 1
    inner_color = rgba(0a0a0ad9)
    outer_color = rgba(ffffff33)
    check_color = rgba(ffffffcc)
    fail_color = rgb(cf6b6b)
    capslock_color = rgb(ffffff)
    font_color = rgb(f0f0f0)
    fade_on_empty = false
    rounding = 8
    font_family = $font
    placeholder_text = <span foreground="##7a7a7a">Password</span>
    fail_text = <span foreground="##cf6b6b">$PAMFAIL</span>
    dots_size = 0.22
    dots_spacing = 0.55
    dots_rounding = 2
    dots_center = false
    position = -110, 110
    halign = right
    valign = bottom
}
label {
    monitor = DP-1
    text = Enter to unlock
    color = rgba(ffffff59)
    font_size = 10
    font_family = $font
    position = -112, 78
    halign = right
    valign = bottom
}

# ---------- side screen: just the time, small, bottom left ----------
label {
    monitor = DP-2
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(ffffffcc)
    font_size = 54
    font_family = $font ExtraBold
    position = 70, 60
    halign = left
    valign = bottom
}
