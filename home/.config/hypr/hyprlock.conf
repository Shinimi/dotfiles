# ╭──────────────────────────────────────────────────────────────╮
# │  hyprlock · Shinobu Kochō — moonlight, right-hand column     │
# │  The moon picture stays sharp on the left; everything you     │
# │  need sits on a glass panel on the right.   made by Claude    │
# ╰──────────────────────────────────────────────────────────────╯
$font = GeistMono Nerd Font
$jp   = Noto Sans CJK JP
$info = ~/.config/hypr/scripts/lock-info.sh

general {
    hide_cursor = true
    ignore_empty_input = true
    grace = 0
}

animations {
    enabled = true
    bezier = ease, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 4, ease
    animation = fadeOut, 1, 3, ease
    animation = inputFieldDots, 1, 2, ease
    animation = inputFieldColors, 1, 3, ease
}

background {
    monitor = DP-1
    path = /home/yu/Pictures/wallpaper/shinobu-wc-68.jpg
    blur_passes = 0
    brightness = 0.8
    contrast = 1.0
    vibrancy = 0.15
}
background {
    monitor = DP-2
    path = /home/yu/Pictures/wallpaper/shinobu-wc-29.jpg
    blur_passes = 3
    blur_size = 6
    brightness = 0.45
}

# ── glass panel on the right ─────────────────────────────────
shape {
    monitor = DP-1
    size = 620, 1440
    color = rgba(13111cb8)
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = right
    valign = center
}
shape {   # thin lilac edge
    monitor = DP-1
    size = 2, 1440
    color = rgba(e49bd855)
    position = -620, 0
    halign = right
    valign = center
}

label {   # 胡蝶しのぶ
    monitor = DP-1
    text = 胡蝶しのぶ
    color = rgba(e49bd8ff)
    font_size = 22
    font_family = $jp Bold
    position = -310, 330
    halign = right
    valign = center
}
label {   # clock
    monitor = DP-1
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(ece4f6)
    font_size = 120
    font_family = $font SemiBold
    position = -130, 190
    halign = right
    valign = center
}
label {   # date
    monitor = DP-1
    text = cmd[update:60000] date +"%A, %d %B" | tr '[:upper:]' '[:lower:]'
    color = rgb(b69cf0)
    font_size = 19
    font_family = $font
    position = -175, 70
    halign = right
    valign = center
}
image {   # your picture
    monitor = DP-1
    path = ~/.face.icon
    size = 96
    rounding = -1
    border_size = 3
    border_color = rgb(b69cf0) rgb(e49bd8) 45deg
    position = -262, -50
    halign = right
    valign = center
}
label {   # greeting
    monitor = DP-1
    text = cmd[update:600000] $info greeting
    color = rgba(ece4f6cc)
    font_size = 15
    font_family = $font
    position = -220, -135
    halign = right
    valign = center
}
input-field {
    monitor = DP-1
    size = 400, 54
    outline_thickness = 2
    inner_color = rgba(252033e6)
    outer_color = rgb(b69cf0) rgb(e49bd8) 45deg
    check_color = rgb(9fdcc0) rgb(8fd3e0) 45deg
    fail_color = rgb(f27a9e) rgb(f5a98a) 45deg
    capslock_color = rgb(f0c98a)
    font_color = rgb(ece4f6)
    fade_on_empty = false
    rounding = 16
    font_family = $font
    placeholder_text = <span foreground="##7d7299">󰌾  password</span>
    fail_text = <span foreground="##f27a9e">$PAMFAIL</span>
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    position = -110, -215
    halign = right
    valign = center
}
label {   # now playing
    monitor = DP-1
    text = cmd[update:2000] $info music
    color = rgb(9fdcc0)
    font_size = 12
    font_family = $font
    position = -110, 90
    halign = right
    valign = bottom
}
label {   # weather
    monitor = DP-1
    text = cmd[update:900000] $info weather
    color = rgba(ece4f6aa)
    font_size = 12
    font_family = $font
    position = -110, 50
    halign = right
    valign = bottom
}

# ── side screen ──────────────────────────────────────────────
label {
    monitor = DP-2
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(ece4f6cc)
    font_size = 64
    font_family = $font SemiBold
    position = 0, 0
    halign = center
    valign = center
}
